apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rates
data:
  rate-cards.json: {{ .Values.rateCards | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ .Release.Name }}}
    spec:
      securityContext: {runAsNonRoot: true}
      containers:
        - name: valueops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: VALUEOPS_RATE_CARDS, value: /config/rate-cards.json}
            - name: VALUEOPS_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.apiKeySecretName }}, key: api-key}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: rates, mountPath: /config, readOnly: true}]
      volumes:
        - name: rates
          configMap: {name: {{ .Release.Name }}-rates}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app.kubernetes.io/name: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
