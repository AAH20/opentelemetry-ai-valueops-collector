name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.24.x"}
      - run: gofmt -w cmd internal && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath ./cmd/valueops
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform -chdir=deploy/terraform/azure init -backend=false
      - run: terraform -chdir=deploy/terraform/azure validate
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm --set apiKeySecretName=fixture-secret
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile}
