name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25.x"}
      - run: gofmt -w cmd component internal && git diff --exit-code
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath ./cmd/valueops
      - run: go install go.opentelemetry.io/collector/cmd/builder@v0.159.0
      - run: builder --config distribution/builder-config.yaml
      - run: ./distribution/generated/otelcol-ai-valueops components | grep aivalue
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform -chdir=deploy/terraform/azure init -backend=false
      - run: terraform -chdir=deploy/terraform/azure validate
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm --set apiKeySecretName=fixture-secret
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile}
